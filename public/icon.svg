<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10b981" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Car Silhouette & Plan badge -->
  <g transform="translate(64, 90)">
    <!-- Car body -->
    <path d="M60 160 C60 145 75 130 95 125 L145 90 C165 76 195 70 230 70 L270 70 C300 70 325 80 340 98 L375 130 C390 135 400 145 400 160 L400 200 C400 215 390 225 375 225 L360 225 C360 210 345 195 330 195 C315 195 300 210 300 225 L160 225 C160 210 145 195 130 195 C115 195 100 210 100 225 L85 225 C70 225 60 215 60 200 Z" fill="#f8fafc" opacity="0.95" />
    
    <!-- Car windshield and windows -->
    <path d="M152 120 L195 90 C205 84 218 82 235 82 L245 82 L245 125 L160 125 Z" fill="#0f172a" opacity="0.75" />
    <path d="M258 82 L275 82 C295 82 312 88 322 100 L345 125 L258 125 Z" fill="#0f172a" opacity="0.75" />

    <!-- Wheels -->
    <circle cx="130" cy="225" r="28" fill="#0f172a" stroke="#10b981" stroke-width="8" />
    <circle cx="130" cy="225" r="10" fill="#f8fafc" />
    <circle cx="330" cy="225" r="28" fill="#0f172a" stroke="#10b981" stroke-width="8" />
    <circle cx="330" cy="225" r="10" fill="#f8fafc" />

    <!-- Document Checkmark badge -->
    <g transform="translate(180, 160)" filter="url(#glow)">
      <circle cx="110" cy="110" r="72" fill="url(#accentGrad)" stroke="#ffffff" stroke-width="8" />
      <path d="M85 110 L102 127 L138 90" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
